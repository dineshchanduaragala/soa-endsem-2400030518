
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: languagetutor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d languagetutor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./LanguageTutorProject
      dockerfile: Dockerfile
    image: languagetutor-backend:latest
    container_name: docker-springboot
    ports:
      - "2025:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/languagetutor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
